<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WiTracEQUIP — Passeport technique d'équipement</title>
<meta name="description" content="WiTracEQUIP — le passeport technique de vos équipements. Scannez le QR code collé sur un appareil, consultez son carnet d'entretien, enregistrez une intervention. Par WiDIAG MQ, Martinique.">

<!-- =========================================================================
     Progressive Web App
     -------------------------------------------------------------------------
     L'application s'installe sur l'écran d'accueil d'un téléphone et démarre
     sans réseau. Aucun magasin d'applications, aucune validation, aucun
     téléchargement de plusieurs dizaines de mégaoctets : un technicien ouvre
     l'adresse une fois, choisit « Ajouter à l'écran d'accueil », et
     l'application est là.
     ========================================================================= -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WiTracEQUIP">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">

<!-- =========================================================================
     Bibliothèques externes
     -------------------------------------------------------------------------
     Chargées en scripts classiques (et non en modules) volontairement : elles
     s'exposent alors en variables globales, que les modules ES6 lisent sans
     dépendre d'un CDN en version ESM. Les modules étant différés par nature,
     ces deux scripts sont toujours exécutés avant le premier import.

     Le Service Worker les met en cache au premier chargement : l'application
     démarre ensuite sans réseau, y compris ces deux fichiers.
     ========================================================================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>

<!-- Toute l'interface est rendue ici par js/app.js. -->
<div id="app"></div>

<!-- Zone d'impression de l'étiquette : masquée à l'écran, seule visible à
     l'impression (voir la règle @media print dans css/style.css). -->
<div id="print-area"></div>

<noscript>
  <div style="max-width:420px;margin:12vh auto;padding:0 18px;font-family:system-ui,sans-serif;">
    <h1>WiTracEQUIP</h1>
    <p>Cette application a besoin de JavaScript pour fonctionner.
       Activez-le dans les réglages de votre navigateur, puis rechargez la page.</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
